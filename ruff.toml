# Conservative rule set matching this codebase's era/style.
# Real errors only: syntax, undefined names, unused variables kept minimal.
target-version = "py310"

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
  "E402",  # imports not at top (common pattern here)
  "E712",  # == False comparisons in tests
  "E722",  # bare except
  "E741",  # ambiguous variable names
  "F401",  # unused imports
  "F541",  # f-strings without placeholders
  "F841",  # unused local variables
]
